# One-click deploy target: https://render.com -> New -> Blueprint -> this repo.
# The free instance sleeps after ~15 minutes idle and takes ~50s to wake, so
# hit the URL once before demoing it.
services:
  - type: web
    name: crewvoice
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ASSEMBLYAI_API_KEY
        sync: false          # set by hand in the Render dashboard, never in git
